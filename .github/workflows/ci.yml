name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 检查仓库隐私
        run: python scripts/check_repository.py

      - name: 检查 Python 语法
        run: python -m compileall -q src scripts tests en.py global_translate.py

      - name: 检查 Shell 语法
        run: bash -n install.sh uninstall.sh packaging/bin/sdf packaging/bin/sdf-global

      - name: 运行测试
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
