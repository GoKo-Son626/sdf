name: Bug report
description: Report a reproducible translation, installation, or desktop integration problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove API keys, tokens, private source text, proxy addresses, and other sensitive information first.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and found no equivalent report.
          required: true
        - label: I did not include API keys, private documents, or other sensitive data.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Run `sdf --version` or `git rev-parse --short HEAD`.
      placeholder: 0.1.0 or 62c3eb7
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution, Wayland/X11, compositor, and relevant application or editor versions.
      placeholder: Arch Linux / Wayland / niri / Neovim 0.12
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Actual behavior
      description: Explain what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Select ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Remove secrets, source text, usernames, personal paths, and proxy details.
      render: shell
