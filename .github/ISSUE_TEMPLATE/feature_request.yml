name: Feature request
description: Suggest platform support, translation capabilities, or workflow improvements
title: "[Feature] "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and found no equivalent request.
          required: true
  - type: textarea
    id: scenario
    attributes:
      label: Use case
      description: Describe the problem you encounter today, not only the implementation you want.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the ideal behavior, target platforms, and possible interaction model.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Explain why the current features do not solve the problem.
