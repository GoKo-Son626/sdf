name: 功能建议
description: 建议新的平台支持、翻译能力或使用体验改进
title: "[Feature] "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已经搜索现有 Issue，确认没有相同建议。
          required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 说明现在遇到的具体困难，而不只是期望的实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明理想行为、适用平台和可能的交互方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方法
      description: 可选。说明现有功能为什么不能满足需求。
