[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdf-translator"
version = "0.1.0"
description = "A fast global AI translation tool for Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sdf = "sdf_translate.cli:main"
sdf-global = "sdf_translate.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
