[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdf-translator"
version = "0.1.0"
description = "A fast global AI translation tool for Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["translation", "wayland", "x11", "linux", "xfce", "niri", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/GoKo-Son626/sdf"
Repository = "https://github.com/GoKo-Son626/sdf.git"
Issues = "https://github.com/GoKo-Son626/sdf/issues"

[project.scripts]
sdf = "sdf_translate.cli:main"
sdf-global = "sdf_translate.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
